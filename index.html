<script>
function openInstructionsModal() {
    document.getElementById('instructions-modal-overlay').style.display = 'flex';
}

function closeInstructionsModal(event) {
    if (event.target.id === 'instructions-modal-overlay') {
        document.getElementById('instructions-modal-overlay').style.display = 'none';
    }
}

function closeModalDirect() {
    document.getElementById('instructions-modal-overlay').style.display = 'none';
}

var map = L.map('map', {
    zoomControl:false, maxZoom:28, minZoom:1
}).fitBounds([[-21.345313900499946,-175.49426775649917],[-21.017627044639426,-174.91178377093664]]);
var hash = new L.Hash(map);
map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
var bounds_group = new L.featureGroup([]);

map.createPane('pane_ESRISatellite_0');
map.getPane('pane_ESRISatellite_0').style.zIndex = 400;
var layer_ESRISatellite_0 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    pane: 'pane_ESRISatellite_0',
    opacity: 1.0,
    attribution: '',
    minZoom: 1,
    maxZoom: 28,
    minNativeZoom: 0,
    maxNativeZoom: 20
});
map.addLayer(layer_ESRISatellite_0);

// Multi-Select & Popup Management
var selectedLayers = [];
var activePopup = L.popup();

function clearSelections() {
    selectedLayers.forEach(function(l) {
        layer_AssetsreplacementcostUSD_1.resetStyle(l);
    });
    selectedLayers = [];
    map.closePopup();
}

// Convert any input safely to a number
function safeNum(val) {
    if (val === null || val === undefined) return 0;
    if (typeof val === 'number') return isNaN(val) ? 0 : val;
    if (typeof val === 'string') {
        var clean = val.replace(/[^0-9.-]+/g, "");
        var n = parseFloat(clean);
        return isNaN(n) ? 0 : n;
    }
    return 0;
}

function formatCurrency(val) {
    return '$' + safeNum(val).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0});
}

function updateSelectionPopup(latlng) {
    if (selectedLayers.length === 0) {
        map.closePopup();
        return;
    }

    var totals = {
        building: 0, fuel: 0, port: 0, waterNet: 0, roads: 0,
        powerLines: 0, powerPoles: 0, telecom: 0, powerAssets: 0,
        water: 0, total: 0
    };

    selectedLayers.forEach(function(l) {
        var p = l.feature.properties;
        
        // Exact Field Mapping based on your GeoJSON
        totals.building += safeNum(p['Building_Allocated_RC_Raw']);
        totals.fuel += safeNum(p['Fuel_Allocated_RC_Raw']);
        totals.port += safeNum(p['Port_Allocated_RC_Raw']);
        totals.waterNet += safeNum(p['Water_Network_Allocated_RC_Raw']);
        totals.roads += safeNum(p['Roads_Allocated_RC_Raw']);
        totals.powerLines += safeNum(p['Power_Lines_Allocated_RC_Raw']);
        totals.powerPoles += safeNum(p['Poles_Allocated_RC_Raw']);
        totals.telecom += safeNum(p['Telecom_Allocated_RC_Raw']);
        totals.powerAssets += safeNum(p['Power_Assets_Allocated_RC_Raw']);
        totals.water += safeNum(p['Water_Allocated_RC_Raw']);
        totals.total += safeNum(p['Total_Replacement_Cost_Raw']);
    });

    var headerText = selectedLayers.length === 1 ? 'Grid Cost Valuation' : 'Selected Grids: ' + selectedLayers.length;

    var content = '<div class="popup-card">' +
        '<div class="popup-card-title">' + headerText + '</div>' +
        '<table class="popup-table">' +
        '<tr><td class="label-col">Building cost:</td><td class="val-col">' + formatCurrency(totals.building) + '</td></tr>' +
        '<tr><td class="label-col">Fuel facilities cost:</td><td class="val-col">' + formatCurrency(totals.fuel) + '</td></tr>' +
        '<tr><td class="label-col">Port facilities cost:</td><td class="val-col">' + formatCurrency(totals.port) + '</td></tr>' +
        '<tr><td class="label-col">Water network cost:</td><td class="val-col">' + formatCurrency(totals.waterNet) + '</td></tr>' +
        '<tr><td class="label-col">Roads cost:</td><td class="val-col">' + formatCurrency(totals.roads) + '</td></tr>' +
        '<tr><td class="label-col">Power lines cost:</td><td class="val-col">' + formatCurrency(totals.powerLines) + '</td></tr>' +
        '<tr><td class="label-col">Power poles cost:</td><td class="val-col">' + formatCurrency(totals.powerPoles) + '</td></tr>' +
        '<tr><td class="label-col">Telecommunication cost:</td><td class="val-col">' + formatCurrency(totals.telecom) + '</td></tr>' +
        '<tr><td class="label-col">Power assets cost:</td><td class="val-col">' + formatCurrency(totals.powerAssets) + '</td></tr>' +
        '<tr><td class="label-col">Water cost:</td><td class="val-col">' + formatCurrency(totals.water) + '</td></tr>' +
        '</table>' +
        '<table class="popup-table popup-total-row">' +
        '<tr><td class="label-col">Total replacement cost:</td><td class="val-col">' + formatCurrency(totals.total) + '</td></tr>' +
        '</table>' +
        (selectedLayers.length > 1 ? '<button onclick="clearSelections()" style="margin-top:10px; width:100%; background:#d9534f; color:#fff; border:none; padding:6px; border-radius:6px; font-weight:bold; cursor:pointer;">Clear Selection</button>' : '') +
        '</div>';

    activePopup.setLatLng(latlng).setContent(content).openOn(map);
}

function onGridClick(e) {
    var layer = e.target;
    var isShiftPressed = e.originalEvent && e.originalEvent.shiftKey;
    var index = selectedLayers.indexOf(layer);

    if (isShiftPressed) {
        if (index > -1) {
            selectedLayers.splice(index, 1);
            layer_AssetsreplacementcostUSD_1.resetStyle(layer);
        } else {
            selectedLayers.push(layer);
            layer.setStyle({ stroke: true, color: '#FFD700', weight: 3, opacity: 1 });
        }
    } else {
        selectedLayers.forEach(function(l) {
            layer_AssetsreplacementcostUSD_1.resetStyle(l);
        });
        selectedLayers = [layer];
        layer.setStyle({ stroke: true, color: '#FFD700', weight: 3, opacity: 1 });
    }

    updateSelectionPopup(e.latlng);
}

function style_AssetsreplacementcostUSD_1_0(feature) {
    var val = safeNum(feature.properties['Total_Replacement_Cost_Raw']);
    if (val >= 0.0 && val <= 245327.8) {
        return { pane: 'pane_AssetsreplacementcostUSD_1', stroke: true, color: '#ffffff', weight: 0.5, opacity: 0.5, fill: true, fillOpacity: 0.7, fillColor: 'rgba(224,238,252,1.0)', interactive: true };
    }
    if (val >= 245327.8 && val <= 821165.9) {
        return { pane: 'pane_AssetsreplacementcostUSD_1', stroke: true, color: '#ffffff', weight: 0.5, opacity: 0.5, fill: true, fillOpacity: 0.7, fillColor: 'rgba(200,220,240,1.0)', interactive: true };
    }
    if (val >= 821165.9 && val <= 1997189.87) {
        return { pane: 'pane_AssetsreplacementcostUSD_1', stroke: true, color: '#ffffff', weight: 0.5, opacity: 0.5, fill: true, fillOpacity: 0.7, fillColor: 'rgba(115,178,216,1.0)', interactive: true };
    }
    if (val >= 1997189.87 && val <= 7374635.36) {
        return { pane: 'pane_AssetsreplacementcostUSD_1', stroke: true, color: '#ffffff', weight: 0.5, opacity: 0.5, fill: true, fillOpacity: 0.7, fillColor: 'rgba(41,121,185,1.0)', interactive: true };
    }
    return { pane: 'pane_AssetsreplacementcostUSD_1', stroke: true, color: '#ffffff', weight: 0.5, opacity: 0.5, fill: true, fillOpacity: 0.7, fillColor: 'rgba(8,48,107,1.0)', interactive: true };
}

map.createPane('pane_AssetsreplacementcostUSD_1');
map.getPane('pane_AssetsreplacementcostUSD_1').style.zIndex = 401;

var layer_AssetsreplacementcostUSD_1 = new L.geoJson(json_AssetsreplacementcostUSD_1, {
    attribution: '',
    interactive: true,
    pane: 'pane_AssetsreplacementcostUSD_1',
    onEachFeature: function(feature, layer) {
        layer.on({ click: onGridClick });

        var rawVal = safeNum(feature.properties['Total_Replacement_Cost_Raw']);
        if (rawVal > 0) {
            layer.bindTooltip(formatCurrency(rawVal), {
                permanent: true,
                direction: 'center',
                className: 'grid-cost-label'
            });
        }
    },
    style: style_AssetsreplacementcostUSD_1_0
});

bounds_group.addLayer(layer_AssetsreplacementcostUSD_1);
map.addLayer(layer_AssetsreplacementcostUSD_1);

var overlaysTree = [
    {label: 'Assets replacement cost (USD)<br /><table><tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_02453280.png" /></td><td>0 - 245328</td></tr><tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_2453288211661.png" /></td><td>245328 - 821166</td></tr><tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_82116619971902.png" /></td><td>821166 - 1997190</td></tr><tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_199719073746353.png" /></td><td>1997190 - 7374635</td></tr><tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_7374635293874414.png" /></td><td>7374635 - 29387441</td></tr></table>', layer: layer_AssetsreplacementcostUSD_1},
    {label: "ESRI Satellite", layer: layer_ESRISatellite_0},
];

var lay = L.control.layers.tree(null, overlaysTree, { collapsed: true });
lay.addTo(map);

// Chart Generation
var myAssetChart = null;

function generateAssetChart() {
    var totals = {
        'Buildings': 0,
        'Roads': 0,
        'Power Infra': 0,
        'Water Infra': 0,
        'Port & Fuel': 0,
        'Telecom': 0
    };

    if (typeof json_AssetsreplacementcostUSD_1 !== 'undefined' && json_AssetsreplacementcostUSD_1.features) {
        json_AssetsreplacementcostUSD_1.features.forEach(function(f) {
            var p = f.properties;
            totals['Buildings'] += safeNum(p['Building_Allocated_RC_Raw']);
            totals['Roads'] += safeNum(p['Roads_Allocated_RC_Raw']);
            totals['Power Infra'] += safeNum(p['Power_Lines_Allocated_RC_Raw']) + safeNum(p['Poles_Allocated_RC_Raw']) + safeNum(p['Power_Assets_Allocated_RC_Raw']);
            totals['Water Infra'] += safeNum(p['Water_Network_Allocated_RC_Raw']) + safeNum(p['Water_Allocated_RC_Raw']);
            totals['Port & Fuel'] += safeNum(p['Port_Allocated_RC_Raw']) + safeNum(p['Fuel_Allocated_RC_Raw']);
            totals['Telecom'] += safeNum(p['Telecom_Allocated_RC_Raw']);
        });
    }

    var canvas = document.getElementById('assetChart');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');

    if (myAssetChart) myAssetChart.destroy();

    myAssetChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: Object.keys(totals),
            datasets: [{
                data: Object.values(totals),
                backgroundColor: ['#0066b2','#36a2eb','#ff6384','#4bc0c0','#ffcd56','#9966ff']
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { boxWidth: 10, padding: 8, font: { family: 'Arial', size: 9 } }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return context.label + ': $' + (context.raw || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
                        }
                    }
                }
            }
        }
    });
}

window.addEventListener('DOMContentLoaded', function() {
    generateAssetChart();
});
</script>
