<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <!-- Core Leaflet Styles -->
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        
        <title>Tongatapu Infrastructure Asset Replacement Cost Valuation</title>
        
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                overflow: hidden;
                font-family: Arial, Helvetica, sans-serif;
                background-color: #ffffff;
            }

            /* Custom Header / Title Banner Styling */
            .map-header {
                padding: 10px 20px;
                background-color: #ffffff;
                text-align: center;
                border-bottom: 2px solid #0056b3;
                box-sizing: border-box;
                height: 75px;
            }

            .map-title {
                margin: 0;
                color: #1a5b8c;
                font-size: 24px;
                font-weight: bold;
            }

            .map-subtitle {
                margin: 4px 0 0 0;
                color: #555555;
                font-size: 14px;
                font-weight: normal;
            }

            /* Responsive Map Container */
            #map {
                width: 100vw;
                height: calc(100vh - 75px);
            }

            /* Enhanced Popup Styling */
            .leaflet-popup-content-wrapper {
                border-radius: 10px !important;
                padding: 6px !important;
                box-shadow: 0 4px 16px rgba(0,0,0,0.2) !important;
            }
            .leaflet-popup-content {
                margin: 8px 12px !important;
                min-width: 220px;
            }

            .popup-title {
                color: #0066b2;
                font-size: 14px;
                font-weight: bold;
                border-bottom: 1px solid #e0e0e0;
                padding-bottom: 6px;
                margin-bottom: 8px;
            }

            .popup-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 12.5px;
            }

            .popup-table th {
                text-align: left;
                color: #444;
                font-weight: 600;
                padding: 3px 0;
            }

            .popup-table td {
                text-align: right;
                color: #0066b2;
                font-weight: bold;
                padding: 3px 0;
            }

            .popup-table tr.total-row {
                border-top: 1px solid #dddddd;
            }

            .popup-table tr.total-row th, 
            .popup-table tr.total-row td {
                padding-top: 6px;
                font-size: 13.5px;
                font-weight: 700;
                color: #111;
            }
        </style>
    </head>
    <body>
        <!-- Header Banner -->
        <header class="map-header">
            <h1 class="map-title">Tongatapu Infrastructure Asset Replacement Cost Valuation</h1>
            <p class="map-subtitle">Infrastructure Exposure Modelling | Tongatapu - Tonga</p>
        </header>

        <!-- Map Container -->
        <div id="map"></div>

        <!-- Essential Leaflet & Plugin Scripts -->
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        
        <!-- Data Import -->
        <script src="data/AssetsreplacementcostUSD_1.js"></script>

        <script>
        // 1. Initialize Map with Full Viewport Bounds
        var map = L.map('map', {
            zoomControl: false, 
            maxZoom: 28, 
            minZoom: 1
        }).fitBounds([[-21.277770517040558, -175.39660559586346], [-21.05675229650531, -174.97404585621942]]);

        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');

        L.control.zoom({ position: 'topleft' }).addTo(map);

        // 2. Base Satellite Layer
        map.createPane('pane_ESRISatellite_0');
        map.getPane('pane_ESRISatellite_0').style.zIndex = 400;

        var layer_ESRISatellite_0 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            pane: 'pane_ESRISatellite_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28
        });
        map.addLayer(layer_ESRISatellite_0);

        // 3. Helper Functions: Number & Currency Formatting
        function formatCurrency(val) {
            if (val === null || val === undefined || isNaN(val)) return '$0';
            return '$' + Number(val).toLocaleString('en-US', { maximumFractionDigits: 0 });
        }

        // 4. Clean Field Configuration for Popups
        var fieldMap = [
            { key: 'Building_Allocated_RC_Raw', label: 'Building Cost' },
            { key: 'Fuel_Allocated_RC_Raw', label: 'Fuel Facilities' },
            { key: 'Port_Allocated_RC_Raw', label: 'Port Facilities' },
            { key: 'Water_Network_Allocated_RC_Raw', label: 'Water Network' },
            { key: 'Roads_Allocated_RC_Raw', label: 'Roads Cost' },
            { key: 'Power_Lines_Allocated_RC_Raw', label: 'Power Lines' },
            { key: 'Poles_Allocated_RC_Raw', label: 'Power Poles' },
            { key: 'Telecom_Allocated_RC_Raw', label: 'Telecom' },
            { key: 'Power_Assets_Allocated_RC_Raw', label: 'Power Assets' },
            { key: 'Water_Allocated_RC_Raw', label: 'Water Assets' },
            { key: 'Total_Replacement_Cost_Raw', label: 'Total Replacement Cost', isTotal: true }
        ];

        // 5. Popup Generator & Interactivity Events
        function pop_AssetsreplacementcostUSD_1(feature, layer) {
            var fid = feature.properties['fid'] ? ' (Cell #' + feature.properties['fid'] + ')' : '';
            var rows = '';

            fieldMap.forEach(function(item) {
                var val = feature.properties[item.key];
                var rowClass = item.isTotal ? 'class="total-row"' : '';
                rows += '<tr ' + rowClass + '><th>' + item.label + '</th><td>' + formatCurrency(val) + '</td></tr>';
            });

            var popupContent = '<div class="popup-title">Asset Valuation Details' + fid + '</div>' +
                               '<table class="popup-table">' + rows + '</table>';

            layer.bindPopup(popupContent, { maxHeight: 380 });

            // Hover Highlight Effect
            layer.on({
                mouseover: function(e) {
                    var l = e.target;
                    l.setStyle({ weight: 2, color: '#FFD700', opacity: 1 });
                    if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                        l.bringToFront();
                    }
                },
                mouseout: function(e) {
                    layer_AssetsreplacementcostUSD_1.resetStyle(e.target);
                }
            });
        }

        // 6. Color Classifier Helper
        function getColor(val) {
            return val > 7374635.36 ? 'rgba(8,48,107,0.75)' :
                   val > 1997189.87 ? 'rgba(41,121,185,0.75)' :
                   val > 821165.90  ? 'rgba(115,178,216,0.75)' :
                   val > 245327.80  ? 'rgba(200,220,240,0.75)' :
                                      'rgba(224,238,252,0.75)';
        }

        // 7. Layer Polygon Styling
        function style_AssetsreplacementcostUSD_1_0(feature) {
            var cost = feature.properties['Total_Replacement_Cost_Raw'] || 0;
            return {
                pane: 'pane_AssetsreplacementcostUSD_1',
                stroke: true,
                color: '#ffffff',
                weight: 0.5,
                opacity: 0.6,
                fill: true,
                fillOpacity: 1,
                fillColor: getColor(cost),
                interactive: true
            };
        }

        // 8. Create & Add Vector Layer
        map.createPane('pane_AssetsreplacementcostUSD_1');
        map.getPane('pane_AssetsreplacementcostUSD_1').style.zIndex = 401;

        var layer_AssetsreplacementcostUSD_1 = new L.geoJson(json_AssetsreplacementcostUSD_1, {
            attribution: '',
            interactive: true,
            pane: 'pane_AssetsreplacementcostUSD_1',
            onEachFeature: pop_AssetsreplacementcostUSD_1,
            style: style_AssetsreplacementcostUSD_1_0
        });

        map.addLayer(layer_AssetsreplacementcostUSD_1);

        // 9. Layer Control Box
        var overlaysTree = [
            {
                label: 'Assets replacement cost (USD)<br />' +
                       '<table>' +
                       '<tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_02453280.png" /></td><td>$0 - $245,328</td></tr>' +
                       '<tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_2453288211661.png" /></td><td>$245,328 - $821,166</td></tr>' +
                       '<tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_82116619971902.png" /></td><td>$821,166 - $1,997,190</td></tr>' +
                       '<tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_199719073746353.png" /></td><td>$1,997,190 - $7,374,635</td></tr>' +
                       '<tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_7374635293874414.png" /></td><td>$7,374,635 - $29,387,441</td></tr>' +
                       '</table>', 
                layer: layer_AssetsreplacementcostUSD_1
            },
            { label: "ESRI Satellite", layer: layer_ESRISatellite_0 }
        ];

        var lay = L.control.layers.tree(null, overlaysTree, { collapsed: true });
        lay.addTo(map);
        </script>
    </body>
</html>
