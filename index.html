<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <!-- Core Leaflet Styles -->
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        
        <!-- Chart.js CDN for Dynamic Graphs -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <title>Tongatapu Infrastructure Asset Replacement Cost Valuation</title>
        
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                overflow: hidden;
                font-family: Arial, Helvetica, sans-serif;
                background-color: #f4f6f9;
            }

            /* Custom Header / Title Banner */
            .map-header {
                padding: 10px 20px;
                background-color: #ffffff;
                text-align: center;
                border-bottom: 2px solid #0056b3;
                box-sizing: border-box;
                height: 75px;
            }

            .map-title {
                margin: 0;
                color: #1a5b8c;
                font-size: 22px;
                font-weight: bold;
            }

            .map-subtitle {
                margin: 4px 0 0 0;
                color: #555555;
                font-size: 13px;
                font-weight: normal;
            }

            /* Main Layout Container (Flexbox for Map + Side Panel) */
            .main-container {
                display: flex;
                width: 100vw;
                height: calc(100vh - 75px);
            }

            #map {
                flex: 1;
                height: 100%;
            }

            /* Analytics & Summary Dashboard Sidebar */
            .dashboard-panel {
                width: 380px;
                height: 100%;
                background: #ffffff;
                border-left: 1px solid #dcdcdc;
                box-sizing: border-box;
                padding: 15px;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            .dash-header {
                font-size: 15px;
                font-weight: bold;
                color: #0066b2;
                border-bottom: 1px solid #e0e0e0;
                padding-bottom: 8px;
                margin-bottom: 10px;
            }

            .dash-hint {
                font-size: 11.5px;
                color: #666;
                margin-bottom: 12px;
                font-style: italic;
            }

            .chart-container {
                position: relative;
                width: 100%;
                height: 220px;
                margin-bottom: 15px;
            }

            .popup-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 12px;
                margin-bottom: 10px;
            }

            .popup-table th {
                text-align: left;
                color: #444;
                font-weight: 600;
                padding: 4px 0;
            }

            .popup-table td {
                text-align: right;
                color: #0066b2;
                font-weight: bold;
                padding: 4px 0;
            }

            .popup-table tr.total-row {
                border-top: 1px solid #dddddd;
            }

            .popup-table tr.total-row th, 
            .popup-table tr.total-row td {
                padding-top: 6px;
                font-size: 13px;
                font-weight: 700;
                color: #111;
            }

            .btn-clear {
                width: 100%;
                background: #d9534f;
                color: #ffffff;
                border: none;
                padding: 8px;
                border-radius: 5px;
                font-weight: bold;
                cursor: pointer;
            }
            .btn-clear:hover {
                background: #c9302c;
            }
        </style>
    </head>
    <body>
        <!-- Header Banner -->
        <header class="map-header">
            <h1 class="map-title">Tongatapu Infrastructure Asset Replacement Cost Valuation</h1>
            <p class="map-subtitle">Infrastructure Exposure Modelling | Tongatapu - Tonga</p>
        </header>

        <!-- Main Body: Map & Dynamic Analytics Sidebar -->
        <div class="main-container">
            <div id="map"></div>
            
            <div class="dashboard-panel">
                <div>
                    <div class="dash-header" id="dash-title">Selection Summary (0 Grids)</div>
                    <div class="dash-hint">Shift + Click on map grids to select and calculate statistics.</div>
                    
                    <div class="chart-container">
                        <canvas id="assetChart"></canvas>
                    </div>
                </div>

                <div>
                    <table class="popup-table" id="dash-table">
                        <tr><td colspan="2" style="text-align:center; color:#888;">No selection made</td></tr>
                    </table>
                    <button class="btn-clear" id="btn-clear-selection" style="display:none;">Clear Selection</button>
                </div>
            </div>
        </div>

        <!-- Essential Leaflet & Plugin Scripts -->
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        
        <!-- Data Import -->
        <script src="data/AssetsreplacementcostUSD_1.js"></script>

        <script>
        // 1. Initialize Map
        var map = L.map('map', {
            zoomControl: false, 
            maxZoom: 28, 
            minZoom: 1
        }).fitBounds([[-21.277770517040558, -175.39660559586346], [-21.05675229650531, -174.97404585621942]]);

        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');

        L.control.zoom({ position: 'topleft' }).addTo(map);

        // 2. Base Satellite Layer
        map.createPane('pane_ESRISatellite_0');
        map.getPane('pane_ESRISatellite_0').style.zIndex = 400;

        var layer_ESRISatellite_0 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            pane: 'pane_ESRISatellite_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28
        });
        map.addLayer(layer_ESRISatellite_0);

        // 3. Helpers
        function safeNum(val) {
            if (val === null || val === undefined) return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            var clean = String(val).replace(/[^0-9.-]+/g, "");
            var n = parseFloat(clean);
            return isNaN(n) ? 0 : n;
        }

        function formatCurrency(val) {
            return '$' + safeNum(val).toLocaleString('en-US', { maximumFractionDigits: 0 });
        }

        // 4. Field Map Configuration (Excluding Total for individual chart segments)
        var fieldMap = [
            { key: 'Building_Allocated_RC_Raw', label: 'Building Cost' },
            { key: 'Fuel_Allocated_RC_Raw', label: 'Fuel Facilities' },
            { key: 'Port_Allocated_RC_Raw', label: 'Port Facilities' },
            { key: 'Water_Network_Allocated_RC_Raw', label: 'Water Network' },
            { key: 'Roads_Allocated_RC_Raw', label: 'Roads Cost' },
            { key: 'Power_Lines_Allocated_RC_Raw', label: 'Power Lines' },
            { key: 'Poles_Allocated_RC_Raw', label: 'Power Poles' },
            { key: 'Telecom_Allocated_RC_Raw', label: 'Telecom' },
            { key: 'Power_Assets_Allocated_RC_Raw', label: 'Power Assets' },
            { key: 'Water_Allocated_RC_Raw', label: 'Water Assets' }
        ];

        // 5. Initialize Chart.js Bar Graph
        var ctx = document.getElementById('assetChart').getContext('2d');
        var assetChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: fieldMap.map(f => f.label),
                datasets: [{
                    label: 'Share (%)',
                    data: new Array(fieldMap.length).fill(0),
                    backgroundColor: '#1a5b8c',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        ticks: { callback: function(value) { return value + '%'; } }
                    },
                    x: {
                        ticks: { font: { size: 10 }, maxRotation: 45, minRotation: 45 }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                var rawVal = context.chart.rawValues ? context.chart.rawValues[context.dataIndex] : 0;
                                return ' Value: ' + formatCurrency(rawVal) + ' (' + context.raw.toFixed(1) + '%)';
                            }
                        }
                    }
                }
            }
        });

        // 6. State Management & Dashboard Updater
        var selectedLayers = [];

        function clearSelections() {
            selectedLayers.forEach(function(l) {
                layer_AssetsreplacementcostUSD_1.resetStyle(l);
            });
            selectedLayers = [];
            updateDashboard();
        }

        function updateDashboard() {
            var dashTitle = document.getElementById('dash-title');
            var dashTable = document.getElementById('dash-table');
            var clearBtn = document.getElementById('btn-clear-selection');

            if (selectedLayers.length === 0) {
                dashTitle.innerText = 'Selection Summary (0 Grids)';
                dashTable.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#888;">No selection made</td></tr>';
                clearBtn.style.display = 'none';
                
                // Reset chart data
                assetChart.data.datasets[0].data = new Array(fieldMap.length).fill(0);
                assetChart.rawValues = new Array(fieldMap.length).fill(0);
                assetChart.update();
                return;
            }

            dashTitle.innerText = selectedLayers.length === 1 
                ? 'Cell #' + (selectedLayers[0].feature.properties['fid'] || 'N/A') + ' Summary'
                : 'Selected Grids Summary (' + selectedLayers.length + ' Grids)';

            clearBtn.style.display = 'block';

            // Accumulate values
            var totals = {};
            var grandTotal = 0;
            fieldMap.forEach(function(item) { totals[item.key] = 0; });

            selectedLayers.forEach(function(layer) {
                var props = layer.feature.properties;
                fieldMap.forEach(function(item) {
                    var val = safeNum(props[item.key]);
                    totals[item.key] += val;
                    grandTotal += val;
                });
            });

            // Calculate overall total replacement cost
            var totalReplacementCost = 0;
            selectedLayers.forEach(function(layer) {
                totalReplacementCost += safeNum(layer.feature.properties['Total_Replacement_Cost_Raw']);
            });

            // Build table rows
            var rows = '';
            var percentages = [];
            var rawValues = [];

            fieldMap.forEach(function(item) {
                var val = totals[item.key];
                rawValues.push(val);
                var pct = grandTotal > 0 ? (val / grandTotal) * 100 : 0;
                percentages.push(pct);

                rows += '<tr><th>' + item.label + '</th><td>' + formatCurrency(val) + ' <span style="font-size:10px; color:#666;">(' + pct.toFixed(1) + '%)</span></td></tr>';
            });

            // Add total row
            rows += '<tr class="total-row"><th>Total Cost</th><td>' + formatCurrency(totalReplacementCost) + '</td></tr>';
            dashTable.innerHTML = rows;

            // Update Chart Data & Percentages
            assetChart.data.datasets[0].data = percentages;
            assetChart.rawValues = rawValues;
            assetChart.update();
        }

        function onGridClick(e) {
            L.DomEvent.stopPropagation(e);
            var layer = e.target;
            var isShiftPressed = e.originalEvent && e.originalEvent.shiftKey;
            var index = selectedLayers.indexOf(layer);

            if (isShiftPressed) {
                if (index > -1) {
                    selectedLayers.splice(index, 1);
                    layer_AssetsreplacementcostUSD_1.resetStyle(layer);
                } else {
                    selectedLayers.push(layer);
                    layer.setStyle({ stroke: true, color: '#FFD700', weight: 3, opacity: 1 });
                }
            } else {
                selectedLayers.forEach(function(l) {
                    layer_AssetsreplacementcostUSD_1.resetStyle(l);
                });
                selectedLayers = [layer];
                layer.setStyle({ stroke: true, color: '#FFD700', weight: 3, opacity: 1 });
            }

            updateDashboard();
        }

        // 7. Styling & Layers
        function getColor(val) {
            return val > 7374635.36 ? 'rgba(8,48,107,0.75)' :
                   val > 1997189.87 ? 'rgba(41,121,185,0.75)' :
                   val > 821165.90  ? 'rgba(115,178,216,0.75)' :
                   val > 245327.80  ? 'rgba(200,220,240,0.75)' :
                                      'rgba(224,238,252,0.75)';
        }

        function style_AssetsreplacementcostUSD_1_0(feature) {
            var cost = feature.properties['Total_Replacement_Cost_Raw'] || 0;
            return {
                pane: 'pane_AssetsreplacementcostUSD_1',
                stroke: true,
                color: '#ffffff',
                weight: 0.5,
                opacity: 0.6,
                fill: true,
                fillOpacity: 1,
                fillColor: getColor(cost),
                interactive: true
            };
        }

        map.createPane('pane_AssetsreplacementcostUSD_1');
        map.getPane('pane_AssetsreplacementcostUSD_1').style.zIndex = 401;

        var layer_AssetsreplacementcostUSD_1 = new L.geoJson(json_AssetsreplacementcostUSD_1, {
            attribution: '',
            interactive: true,
            pane: 'pane_AssetsreplacementcostUSD_1',
            onEachFeature: function(feature, layer) {
                layer.on({
                    click: onGridClick,
                    mouseover: function(e) {
                        var l = e.target;
                        if (selectedLayers.indexOf(l) === -1) {
                            l.setStyle({ weight: 2, color: '#FFD700', opacity: 0.9 });
                        }
                    },
                    mouseout: function(e) {
                        var l = e.target;
                        if (selectedLayers.indexOf(l) === -1) {
                            layer_AssetsreplacementcostUSD_1.resetStyle(l);
                        }
                    }
                });
            },
            style: style_AssetsreplacementcostUSD_1_0
        });

        map.addLayer(layer_AssetsreplacementcostUSD_1);

        map.on('click', function(e) {
            clearSelections();
        });

        document.getElementById('btn-clear-selection').onclick = function() {
            clearSelections();
        };

        // 8. Layer Control Box
        var overlaysTree = [
            {
                label: 'Assets replacement cost (USD)<br />' +
                       '<table>' +
                       '<tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_02453280.png" /></td><td>$0 - $245,328</td></tr>' +
                       '<tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_2453288211661.png" /></td><td>$245,328 - $821,166</td></tr>' +
                       '<tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_82116619971902.png" /></td><td>$821,166 - $1,997,190</td></tr>' +
                       '<tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_199719073746353.png" /></td><td>$1,997,190 - $7,374,635</td></tr>' +
                       '<tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_7374635293874414.png" /></td><td>$7,374,635 - $29,387,441</td></tr>' +
                       '</table>', 
                layer: layer_AssetsreplacementcostUSD_1
            },
            { label: "ESRI Satellite", layer: layer_ESRISatellite_0 }
        ];

        var lay = L.control.layers.tree(null, overlaysTree, { collapsed: true });
        lay.addTo(map);
        </script>
    </body>
</html>
