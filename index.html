        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-21.277770517040558,-175.39660559586346],[-21.05675229650531,-174.97404585621942]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_ESRISatellite_0');
        map.getPane('pane_ESRISatellite_0').style.zIndex = 400;
        var layer_ESRISatellite_0 = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {

            var popupContent = '<table>\

                    </tr>\
                    <tr>\
                        <th scope="row">Power_Assets_Allocated_RC_Raw</th>\
                        <td class="visible-with-data" id="Power_Assets_Allocated_RC_Raw">' + (feature.properties['Power_Assets_Allocated_RC_Raw'] !== null ? autolinker.link(String(feature.properties['Power_Assets_Allocated_RC_Raw']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\

                        <td class="visible-with-data" id="Water_Allocated_RC_Raw">' + (feature.properties['Water_Allocated_RC_Raw'] !== null ? autolinker.link(String(feature.properties['Water_Allocated_RC_Raw']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Total_Replacement_Cost_Raw</th>\
                        <td class="visible-with-data" id="Total_Replacement_Cost_Raw">' + (feature.properties['Total_Replacement_Cost_Raw'] !== null ? autolinker.link(String(feature.properties['Total_Replacement_Cost_Raw']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_AssetsreplacementcostUSD_1_0(feature) {
            if (feature.properties['Total_Replacement_Cost_Raw'] >= 0.000000 && feature.properties['Total_Replacement_Cost_Raw'] <= 245327.800000 ) {

            }
            if (feature.properties['Total_Replacement_Cost_Raw'] >= 245327.800000 && feature.properties['Total_Replacement_Cost_Raw'] <= 821165.900000 ) {
                return {

            if (feature.properties['Total_Replacement_Cost_Raw'] >= 821165.900000 && feature.properties['Total_Replacement_Cost_Raw'] <= 1997189.870000 ) {
                return {

            }
            if (feature.properties['Total_Replacement_Cost_Raw'] >= 1997189.870000 && feature.properties['Total_Replacement_Cost_Raw'] <= 7374635.360000 ) {
                return {

                interactive: true,
            }
            }
            if (feature.properties['Total_Replacement_Cost_Raw'] >= 7374635.360000 && feature.properties['Total_Replacement_Cost_Raw'] <= 29387441.480000 ) {
                return {

                stroke: false, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(8,48,107,1.0)',
                interactive: true,
            }
            }
        }
        map.createPane('pane_AssetsreplacementcostUSD_1');
        map.getPane('pane_AssetsreplacementcostUSD_1').style.zIndex = 401;
        map.getPane('pane_AssetsreplacementcostUSD_1').style['mix-blend-mode'] = 'normal';
        var layer_AssetsreplacementcostUSD_1 = new L.geoJson(json_AssetsreplacementcostUSD_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_AssetsreplacementcostUSD_1',
            layerName: 'layer_AssetsreplacementcostUSD_1',
            pane: 'pane_AssetsreplacementcostUSD_1',

        });
        bounds_group.addLayer(layer_AssetsreplacementcostUSD_1);
        map.addLayer(layer_AssetsreplacementcostUSD_1);
        var overlaysTree = [
            {label: 'Assets replacement cost (USD)<br /><table><tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_02453280.png" /></td><td>0 - 245328</td></tr><tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_2453288211661.png" /></td><td>245328 - 821166</td></tr><tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_82116619971902.png" /></td><td>821166 - 1997190</td></tr><tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_199719073746353.png" /></td><td>1997190 - 7374635</td></tr><tr><td style="text-align: center;"><img src="legend/AssetsreplacementcostUSD_1_7374635293874414.png" /></td><td>7374635 - 29387441</td></tr></table>', layer: layer_AssetsreplacementcostUSD_1},
            {label: "ESRI Satellite", layer: layer_ESRISatellite_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
